bugreports:
  - summary: |
      Кнопка «Next» пропадает на 4-й странице каталога, страницы 5–7 недоступны
    environment: |
      Google Chrome 156.0.8078.47 (64 бит)
      ОС Windows 11 Pro 10.0.22000
      Окно браузера 1366x900
      Приложение: версия 2 (в подвале «version 2»), https://products-store-v2-ru.hexlet.app/ (перенаправляет на https://products-store-v2.hexlet.app/)
    steps-to-reproduce: |
      1. Открыть https://products-store-v2-ru.hexlet.app/
      2. Трижды нажать «Next»
    expected-result: |
      На 4-й странице есть кнопка «Next», ею можно дойти до 7-й страницы (194 товара)
    actual-result: |
      На 4-й странице выводится только кнопка «Previous»: на ней 29 товаров (товар с нулевым остатком скрыт фильтром «In Stock»),. Товары 5–7 страниц открыть из каталога нельзя.
      Скриншот: assets/v2-catalog-page4-no-next.png

  - summary: |
      При пустом результате поиска или фильтра выводится весь каталог вместо «Nothing found!»
    environment: |
      Google Chrome 156.0.8078.47 (64 бит)
      ОС Windows 11 Pro 10.0.22000
      Окно браузера 1366x900
      Приложение: версия 2 (в подвале «version 2»), https://products-store-v2-ru.hexlet.app/ (перенаправляет на https://products-store-v2.hexlet.app/)
    steps-to-reproduce: |
      1. Открыть https://products-store-v2-ru.hexlet.app/
      2. Ввести «qwertyzz» в поле «Search»
    expected-result: |
      Карточки не выводятся, выведено сообщение «Nothing found!» (как в версии 1)
    actual-result: |
      Выводятся все 30 товаров страницы, сообщения нет, кнопки пагинации пропадают. Так же при «From» = 100 и «To» = 10 выводятся все 30 товаров. Пользователь не понимает, что ничего не найдено.
      Скриншот: assets/v2-search-no-results.png
      Лог DevTools: assets/v2-search-no-results-devtools.txt

  - summary: |
      Переход по ссылке «Store» в шапке перезагружает страницу целиком
    environment: |
      Google Chrome 156.0.8078.47 (64 бит)
      ОС Windows 11 Pro 10.0.22000
      Окно браузера 1366x900
      Приложение: версия 2 (в подвале «version 2»), https://products-store-v2-ru.hexlet.app/ (перенаправляет на https://products-store-v2.hexlet.app/)
    steps-to-reproduce: |
      1. Открыть https://products-store-v2-ru.hexlet.app/cart
      2. Открыть DevTools, вкладку Network
      3. Нажать «Store» в шапке
    expected-result: |
      Каталог открывается без перезагрузки (SPA): выполняется только запрос /api/products, как в версии 1
    actual-result: |
      Браузер заново запрашивает документ https://products-store-v2.hexlet.app/, index-BgyHCLwh.css и index-CVwywYTQ.js — страница перезагружается полностью.
      Лог DevTools v2: assets/v2-store-link-reload-devtools.txt
      Для сравнения v1: assets/v1-store-link-spa-devtools.txt
