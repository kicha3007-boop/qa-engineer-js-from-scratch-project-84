- summary: |
    Фильтр по цене не включает товары с ценой, равной границе диапазона
  environment: |
    Google Chrome 156.0.8078.47 (64 бит)
    ОС Windows 11 Pro 10.0.22000
    Окно браузера 1366x900
    Приложение: версия 1 (в подвале «version 1»), https://products-store-ru.hexlet.app/ (перенаправляет на https://products-store.hexlet.app/)
  steps-to-reproduce: |
    1. Открыть https://products-store-ru.hexlet.app/
    2. В поле «From» блока «Price» ввести 1.49
    3. В поле «To» ввести 1.49
  expected-result: |
    Выведена карточка «Cucumber» (цена 1.49$)
  actual-result: |
    Выведено «Nothing found!». Так же при «To» = 1.99 не выводится «Apple» (1.99$): границы диапазона исключаются из результата.

