---
- summary: |
    В карточках каталога не выводится рейтинг товара
  environment: |
    Google Chrome 156.0.8078.47 (64 бит)
    ОС Windows 11 Pro 10.0.22000
    Окно браузера 1366x900
    Приложение: версия 1 (в подвале «version 1»), https://products-store-ru.hexlet.app/ (перенаправляет на https://products-store.hexlet.app/)
  steps-to-reproduce: |
    1. Открыть https://products-store-ru.hexlet.app/
    2. Найти карточку «Essence Mascara Lash Princess»
  expected-result: |
    В карточке выведен рейтинг товара 2.56 (как на странице товара: «Rating: 2.56 ★»)
  actual-result: |
    В карточке выведены только цены 9.99$ и 8.94$ и число 99 без подписи (это остаток на складе); рейтинга нет ни в одной карточке каталога.
    Скриншот: assets/v1-catalog-cards-1366.png

- summary: |
    Поиск находит товары только на открытой странице каталога
  environment: |
    Google Chrome 156.0.8078.47 (64 бит)
    ОС Windows 11 Pro 10.0.22000
    Окно браузера 1366x900
    Приложение: версия 1 (в подвале «version 1»), https://products-store-ru.hexlet.app/ (перенаправляет на https://products-store.hexlet.app/)
  steps-to-reproduce: |
    1. Открыть https://products-store-ru.hexlet.app/
    2. Ввести «iphone» в поле «Search»
  expected-result: |
    Выведены 7 товаров каталога со словом iPhone в названии: «Apple iPhone Charger», «iPhone 12 Silicone Case with MagSafe Plum», «Selfie Lamp with iPhone», «iPhone 5s», «iPhone 6», «iPhone 13 Pro», «iPhone X»
  actual-result: |
    Выведено сообщение «Nothing found!»: поиск идёт только по 30 товарам 1-й страницы, товары с 4-й и 5-й страниц не находятся.
    Скриншот: assets/v1-search-iphone.png

- summary: |
    Нельзя сбросить выбранную категорию в фильтре «Category»
  environment: |
    Google Chrome 156.0.8078.47 (64 бит)
    ОС Windows 11 Pro 10.0.22000
    Окно браузера 1366x900
    Приложение: версия 1 (в подвале «version 1»), https://products-store-ru.hexlet.app/ (перенаправляет на https://products-store.hexlet.app/)
  steps-to-reproduce: |
    1. Открыть https://products-store-ru.hexlet.app/
    2. Нажать «Category»
    3. Выбрать «fragrances»
    4. Снова нажать «Category»
  expected-result: |
    В списке есть пункт сброса (все категории), после его выбора снова выводятся все 30 товаров страницы
  actual-result: |
    В списке только категории beauty, fragrances, furniture, groceries; пункта сброса нет. Вернуть все товары можно только перезагрузкой страницы.
