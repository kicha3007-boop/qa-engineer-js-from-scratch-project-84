- summary: |
    Оформление заказа завершается ошибкой 500, но пользователю показывается сообщение об успехе
  environment: |
    Google Chrome 156.0.8078.47 (64 бит)
    ОС Windows 11 Pro 10.0.22000
    Окно браузера 1366x900
    Приложение: версия 1 (в подвале «version 1»), https://products-store-ru.hexlet.app/ (перенаправляет на https://products-store.hexlet.app/)
  steps-to-reproduce: |
    1. Открыть https://products-store-ru.hexlet.app/
    2. В карточке «Essence Mascara Lash Princess» нажать «Add to cart»
    3. Нажать «Cart» в шапке
    4. Открыть DevTools, вкладки Console и Network
    5. Нажать «Checkout»
  expected-result: |
    Запрос POST /api/orders выполнен успешно (2xx), выведено окно «Order placed successfully»; при ошибке сервера пользователю выводится сообщение о неудаче
  actual-result: |
    POST https://products-store.hexlet.app/api/orders возвращает 500 с телом {"message":"Failed to create order","statusCode":500}, в консоли ошибка «Failed to load resource: the server responded with a status of 500»; при этом выводится окно «Order placed successfully» — заказ не создан, а пользователь считает, что создан.
    Скриншот: assets/v1-order-500-modal.png
    Лог DevTools: assets/v1-order-500-devtools.txt

- summary: |
    На экране 375px колонка фильтров сжата до 88px, поля поиска и цены не помещаются
  environment: |
    Google Chrome 156.0.8078.47 (64 бит)
    ОС Windows 11 Pro 10.0.22000
    Эмуляция устройства в DevTools (Device Toolbar), экран 375x812
    Приложение: версия 1 (в подвале «version 1»), https://products-store-ru.hexlet.app/ (перенаправляет на https://products-store.hexlet.app/)
  steps-to-reproduce: |
    1. Открыть https://products-store-ru.hexlet.app/ в режиме Device Toolbar 375x812
    2. Просмотреть блок фильтров
  expected-result: |
    Фильтры занимают ширину экрана (или скрыты в отдельный блок), поля «Search» и «From - To» помещаются и читаются, карточки товаров видны без прокрутки всего списка фильтров
  actual-result: |
    Колонка фильтров шириной 88px: поле «Search» выходит за её границу (правый край 201px), поля цены шириной 32px (значения не читаются), названия производителей переносятся по словам; первая карточка товара начинается только на 1293px от верха страницы.
    Скриншот: assets/v1-mobile-375-catalog-filters.png
    Замеры DevTools: assets/v1-mobile-375-catalog-metrics.txt

