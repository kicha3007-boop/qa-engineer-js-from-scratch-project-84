- summary: |
    Не загружается изображение флага у пункта «English» в меню «Language»
  environment: |
    Google Chrome 156.0.8078.47 (64 бит)
    ОС Windows 11 Pro 10.0.22000
    Окно браузера 1366x900
    Приложение: версия 1 (в подвале «version 1»), https://products-store-ru.hexlet.app/ (перенаправляет на https://products-store.hexlet.app/)
  steps-to-reproduce: |
    1. Открыть https://products-store-ru.hexlet.app/
    2. Открыть DevTools, вкладку Network
    3. Нажать «Language» в шапке
  expected-result: |
    У пунктов English, Russian, Spanish выводятся флаги, все изображения загружаются с типом image/*
  actual-result: |
    У пункта «English» вместо флага битое изображение с текстом alt «English». В Network запрос https://products-store.hexlet.app/english возвращает 200 с content-type text/html (страница приложения вместо картинки), naturalWidth изображения 0. На страницах товаров запрашивается /products/english с тем же результатом.
    Скриншот: assets/v1-lang-menu-broken-flag.png
    Лог DevTools: assets/v1-lang-flag-devtools.txt

- summary: |
    При открытии несуществующего товара страница становится полностью пустой, в консоли ошибка TypeError
  environment: |
    Google Chrome 156.0.8078.47 (64 бит)
    ОС Windows 11 Pro 10.0.22000
    Окно браузера 1366x900
    Приложение: версия 1 (в подвале «version 1»), https://products-store-ru.hexlet.app/ (перенаправляет на https://products-store.hexlet.app/)
  steps-to-reproduce: |
    1. Открыть DevTools, вкладку Console
    2. Открыть https://products-store-ru.hexlet.app/products/9999
  expected-result: |
    Выведены шапка сайта и сообщение «Товар не найден»; необработанных ошибок в консоли нет
  actual-result: |
    Страница полностью белая — пропадают и шапка, и подвал (body пустой). API отвечает 404 {"message":"Product with id '9999' not found"}, затем в консоли «TypeError: Cannot read properties of undefined (reading 'map')».
    Скриншот: assets/v1-product-9999-blank.png
    Лог DevTools: assets/v1-product-9999-devtools.txt

